# CI on demand: the full test suite of a branch
#
# Every preset on Linux, and core on Windows (MSVC) and macOS, every test: the matrix of the
# nightly, for a branch that needs it before a merge (a change to the build, a platform fix).
# Start one by hand: Actions > merge > Run workflow, or `gh workflow run merge.yml --ref <branch>`.
# The merge queue runs ci.yml (tier 1); the whole matrix runs every night (nightly.yml).

name: merge

on:
  workflow_dispatch:

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/build.yml
    with:
      preset: core

  torch:
    uses: ./.github/workflows/build.yml
    with:
      preset: torch

  python:
    uses: ./.github/workflows/build.yml
    with:
      preset: python

  python-torch:
    uses: ./.github/workflows/build.yml
    with:
      preset: python-torch

  # MSVC and Apple clang reject code that GCC accepts (PR #2: a directive inside a macro argument)
  core-windows:
    uses: ./.github/workflows/build.yml
    with:
      os: windows-latest
      preset: core

  core-macos:
    uses: ./.github/workflows/build.yml
    with:
      os: macos-latest
      preset: core

  ci-gate:
    if: always()
    needs: [core, torch, python, python-torch, core-windows, core-macos]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1;; esac
