# build - configures, builds and tests one preset on one OS (called by ci.yml, merge.yml, nightly.yml)
#
# The install commands of the README (the presets) with one addition: no -march=native, because the
# runners differ in CPU and a build must run on the one that tests it. One build, then one step per
# ctest label (`labels`), each with its own status; a label the preset has no tests of passes empty.

name: build

on:
  workflow_call:
    inputs:
      os:
        description: runner label
        type: string
        default: ubuntu-24.04
      preset:
        description: configure, build and test preset of CMakePresets.json
        type: string
        required: true
      tests:
        description: ALL, or the regex of the ctest names to run (scripts/ci/affected_tests.py)
        type: string
        default: ALL
      build_type:
        description: CMAKE_BUILD_TYPE, empty for the preset's
        type: string
        default: ""
      cxx_flags:
        description: CMAKE_CXX_FLAGS, for instance the sanitizers
        type: string
        default: ""
      ccache_key:
        description: suffix of the compiler cache key
        type: string
        default: ""
      oracle:
        description: also run the lean tests, against the CORALean oracle pinned in scripts/coralean.cmake (Linux)
        type: boolean
        default: false
      labels:
        description: the ctest labels to run, one step each (CMakeLists.txt, "tests")
        type: string
        default: unit oracle backend-eigen backend-torch gradcheck python example
      free_disk:
        description: remove the runner's preinstalled toolchains first (a sanitizer build fills the disk)
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.preset }} on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    env:
      # a job that downloads the oracle must not skip a test that needs it (tests/global/oracle/oracle_testing.h)
      CORACPP_REQUIRE_ORACLE: ${{ inputs.oracle && '1' || '' }}
    steps:
      - name: free disk space
        if: inputs.free_disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      # the compiler cache is an optimisation: a failed install (e.g. a mirror outage) builds without it
      - uses: hendrikmuhs/ccache-action@v1.2.24
        id: ccache
        if: runner.os != 'Windows'
        continue-on-error: true
        with:
          key: ${{ inputs.preset }}-${{ inputs.os }}${{ inputs.ccache_key }}
      # the oracle archive (about 50 MB), fetched once per pinned version
      - uses: actions/cache@v4
        if: inputs.oracle
        with:
          path: build/${{ inputs.preset }}/coralean
          key: coralean-${{ hashFiles('scripts/coralean.cmake') }}
      - name: configure
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
          BUILD_TYPE: ${{ inputs.build_type }}
          CXX_FLAGS: ${{ inputs.cxx_flags }}
          ORACLE: ${{ inputs.oracle && '-DCORACPP_ORACLE=DOWNLOAD' || '' }}
        run: cmake --preset ${{ inputs.preset }} -DCORACPP_NATIVE=OFF ${BUILD_TYPE:+-DCMAKE_BUILD_TYPE=$BUILD_TYPE} "-DCMAKE_CXX_FLAGS=$CXX_FLAGS" $ORACLE
      - name: build
        id: build
        run: cmake --build --preset ${{ inputs.preset }}
      - name: test unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' unit ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^unit$' "${filter[@]}"
      - name: test oracle
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' oracle ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^oracle$' "${filter[@]}"
      - name: test backend-eigen
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' backend-eigen ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^backend-eigen$' "${filter[@]}"
      - name: test backend-torch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' backend-torch ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^backend-torch$' "${filter[@]}"
      - name: test gradcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' gradcheck ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^gradcheck$' "${filter[@]}"
      - name: test python
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' python ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^python$' "${filter[@]}"
      - name: test example
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' example ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j4 --output-on-failure -L '^example$' "${filter[@]}"
      - name: test benchmark
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(format(' {0} ', inputs.labels), ' benchmark ') }}
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          filter=(); [ "$TESTS" = ALL ] || filter=(-R "$TESTS")
          ctest --preset ${{ inputs.preset }} -j2 --output-on-failure -L '^benchmark$' "${filter[@]}"
