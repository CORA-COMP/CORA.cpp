name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No -march=native: the runners differ in CPU, and a build must run on the one that tests it.
  OPT: -O2 -std=c++20 -fopenmp -DNDEBUG -DEIGEN_NO_DEBUG
  CXX: ccache g++

jobs:
  # The library on Eigen alone: the conventions, the C++ tests, and the C++ examples.
  eigen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: eigen
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: make TORCH= -j$(nproc) test example

  # With libtorch on the CPU: batching and gradients, and the Python package with its tests.
  torch:
    runs-on: ubuntu-24.04
    env:
      CORACPP_ENV: none  # the tests that run scripts/with_env.sh use this Python, not a conda env
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: torch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: pip install numpy matplotlib && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: make -j$(nproc) test example python
      - run: PYTHONPATH=build python -m unittest discover -s tests/python

  # The CORA-COMP binary and its tests.
  competition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: competition
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libglpk-dev
      - run: make TORCH= -j$(nproc) all test-competition
