name: CI

on:
  push:
    branches: [main]
  pull_request:

# The install jobs run the commands of the README, with one addition: no -march=native, because the
# runners differ in CPU and a build must run on the one that tests it.

jobs:
  # README, "C++ only", on the three platforms: the library, the tests and the examples on Eigen.
  cpp-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-linux
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure

  cpp-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-macos
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure

  cpp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure

  # README, "Optional: torch backend and Python package": a virtual environment, requirements.txt,
  # then the same build; the Python tests run with the package on PYTHONPATH.
  torch-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: torch-linux
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure
          PYTHONPATH=build python examples/python/example_linear_reach_01_5dim.py

  torch-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: torch-macos
      - run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure
          PYTHONPATH=build python examples/python/example_linear_reach_01_5dim.py

  torch-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCORACPP_NATIVE=OFF
          cmake --build build --parallel --config Release
          ctest --test-dir build -j4 -C Release --output-on-failure
          $env:PYTHONPATH = "build"
          python examples/python/example_linear_reach_01_5dim.py

  # The CORA-COMP binary and its tests.
  competition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: competition
      - run: sudo apt-get update && sudo apt-get install -y libglpk-dev
      - run: |
          cmake -S . -B build -DCORACPP_NATIVE=OFF -DCORACPP_TORCH=OFF -DCORACPP_COMPETITION=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          ctest --test-dir build -j4 --output-on-failure -L competition
