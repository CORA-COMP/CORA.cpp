name: CI

on:
  push:
    branches: [main]
  pull_request:

# The install jobs run the commands of the README (the presets) on the three platforms, with one
# addition: no -march=native, because the runners differ in CPU and a build must run on the one
# that tests it.

jobs:
  install:
    name: ${{ matrix.preset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        preset: [core, torch, python, python-torch]
        exclude:  # the torch presets take too long to build on the slow runners
          - { os: macos-latest, preset: torch }
          - { os: macos-latest, preset: python-torch }
          - { os: windows-latest, preset: torch }
          - { os: windows-latest, preset: python-torch }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: runner.os != 'Windows'
        with:
          key: ${{ matrix.preset }}-${{ matrix.os }}
      - name: configure
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
        run: cmake --preset ${{ matrix.preset }} -DCORACPP_NATIVE=OFF
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  # The CORA-COMP binary and its tests.
  competition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: competition
      - run: sudo apt-get update && sudo apt-get install -y libglpk-dev
      - run: |
          cmake -S . -B build -DCORACPP_NATIVE=OFF -DCORACPP_TORCH=OFF -DCORACPP_COMPETITION=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          ctest --test-dir build -j4 --output-on-failure -L competition

  # The lean tests against the CORALean oracle, fetched from the pinned release (scripts/coralean.cmake).
  # Disabled until CORALean has a public release; CONTRIBUTING.md, "CORALean oracle", lists what is left.
  oracle:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: oracle
      - run: cmake --preset core -DCORACPP_NATIVE=OFF -DCORACPP_ORACLE=DOWNLOAD -DCORACPP_ORACLE_UNSOUND=DOWNLOAD -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset core
      - run: ctest --preset core -R '^global/oracle/' --output-on-failure
