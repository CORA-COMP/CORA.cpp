# CI, tier 1: every push to a pull request and every merge-queue group (target: under 10 minutes)
#
# `checks` needs no build (it includes clang-format and ruff on the changed files); `tidy` configures the
# python preset and runs clang-tidy on the changed translation units. linux-core runs the labels unit, oracle,
# backend-eigen and example, linux-python the label python, both against the CORALean oracle, one step per label:
# every test (a documentation-only change skips them, scripts/ci/affected_tests.py). In the merge queue a group
# whose tree is the tree of its pull request's head, which passed `ci-gate`, is not built again: that run tested
# this very tree (the usual case, a pull request rebased onto main right before it is queued). Any other group
# (several pull requests, or one based on an older main) runs every test of the group on the main it lands on.
# `torch-syntax` parses every test against libtorch's headers; `torch-tests` (backend-torch, gradcheck and the
# examples, the ones that need libtorch included),
# `python-torch-tests` (the Python tests on libtorch), each about an hour, run on every change but documentation,
# benchmarks and scripts, and the Windows build (`windows-core`, as linux-core) run beside the gate.
# `instructions` compares the micro-benchmarks with the
# base commit's (pull requests only). The whole matrix (every preset, Windows, macOS, sanitizers) is tier 3
# (nightly.yml), which opens an issue when it fails; merge.yml runs it on demand. Require `ci-gate`.

name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      perf: ${{ steps.select.outputs.perf }}
      build: ${{ steps.select.outputs.build }}
      torch: ${{ steps.select.outputs.torch }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Merge queue only: is this group's tree the tree of a pull request head that passed `ci-gate`?
      # Then that run tested exactly this tree, and the builds below are skipped.
      - name: already tested
        id: tested
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          REF: ${{ github.event.merge_group.head_ref }}
        run: |
          tested=false
          pr=$(printf '%s' "$REF" | sed -nE 's#^(refs/heads/)?gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$#\2#p')
          if [ -n "$pr" ]; then
            prhead=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
            git fetch --quiet origin "refs/pull/$pr/head"
            gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$prhead/check-runs?check_name=ci-gate" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            if [ "$(git rev-parse "$HEAD^{tree}")" = "$(git rev-parse "$prhead^{tree}")" ] && [ "$gate" -gt 0 ]; then
              tested=true
            fi
            echo "pull request #$pr, head $prhead, ci-gate successes: $gate, same tree: $tested"
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - run: python3 -m pip install --quiet pyyaml -r scripts/requirements-quality.txt
      - name: format
        run: python3 scripts/ci/check_format.py
      - name: clang-format
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py format --base "$BASE"
      - name: ruff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py lint --base "$BASE"
      - name: conventions
        run: python3 tests/global/test_coding_conventions.py
      - name: coverage
        run: |
          if [ -f scripts/coverage/coverage.py ]; then python3 scripts/coverage/coverage.py --check
            python3 scripts/coverage/coverage.py --summary >> "$GITHUB_STEP_SUMMARY"
          else echo "scripts/coverage/coverage.py is absent: skipped"; fi
      - name: backing report files
        run: |
          python3 scripts/coverage/benchmarks.py --files
          python3 scripts/coverage/vnncomp.py --files
      - name: paper table
        run: python3 scripts/paper/arch_table.py --check
      - name: paper figures
        run: python3 scripts/paper/status_figure.py --check
      - name: paper VNN-COMP tables
        run: python3 scripts/paper/vnn_table.py --check
      - name: select the affected tests
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          affected=$(python3 scripts/ci/affected_tests.py "$BASE" "$HEAD")
          # the micro-benchmarks run when the library, the build or the benchmarks changed
          if [ "$affected" = ALL ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(src|include|benchmarks)/'; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
          else
            echo "perf=false" >> "$GITHUB_OUTPUT"
          fi
          # the libtorch and the Windows builds run when the library, the tests or the build changed
          if [ "$affected" = ALL ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(src|include|tests|cmake)/|(^|/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          # the runs of the libtorch tests (an hour each): whenever the library, the tests, the Python package or the
          # build changed, i.e. unless the change is documentation, benchmarks or scripts only (NO_TORCH_PATTERNS)
          echo "torch=$(python3 scripts/ci/affected_tests.py --torch "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          # every test unless the change is documentation only; none for a tree a pull request run tested
          tests=ALL
          if [ "$affected" = NONE ] || [ "$TESTED" = true ]; then tests=NONE; fi
          echo "affected: $affected, selected: $tests"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  tidy:
    needs: checks
    if: needs.checks.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet -r scripts/requirements-quality.txt
      - name: configure (the compile database, with the Python bindings)
        run: cmake --preset python -DCORACPP_NATIVE=OFF
      - name: clang-tidy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py tidy --base "$BASE" -j "$(nproc)"

  linux-core:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE'
    uses: ./.github/workflows/build.yml
    with:
      preset: core
      tests: ${{ needs.checks.outputs.tests }}
      oracle: true
      labels: unit oracle backend-eigen example

  linux-python:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE'
    uses: ./.github/workflows/build.yml
    with:
      preset: python
      tests: ${{ needs.checks.outputs.tests }}
      oracle: true
      labels: python

  # Every test translation unit parsed against libtorch's headers (-fsyntax-only, no linking): a name
  # that is ambiguous only once they are included (detail::) fails here (#143, #149). libtorch's header
  # is precompiled, which makes the parse 2.5 times faster (20 instead of 50 minutes); a ccache cannot
  # help, so the time is the same warm or cold. In `ci-gate`.
  torch-syntax:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE' && needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: cmake --preset torch -DCORACPP_NATIVE=OFF
      - name: precompiled libtorch header
        run: |
          header=$(python3 scripts/ci/syntax_check.py build/torch --make-pch)
          # the flags of the compiles do not change; -include reads header.gch beside the header
          cmake --preset torch -DCORACPP_NATIVE=OFF "-DCMAKE_CXX_FLAGS=-include $header"
      - name: syntax check of the tests
        run: python3 scripts/ci/syntax_check.py build/torch -j4

  # The test programs of backend-torch (an oracle test's body on libtorch) and gradcheck, built and run:
  # catches a run-time failure on libtorch (#148). The build takes about 57 minutes (cold or warm: a
  # ccache of 500 MB holds almost none of it), so it is not in `ci-gate`; it runs on every change except
  # documentation, benchmarks and scripts (scripts/ci/affected_tests.py --torch), because #196 and #203 broke
  # tests that only a libtorch run shows; the nightly runs the same tests.
  torch-tests:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE' && needs.checks.outputs.torch == 'true'
    uses: ./.github/workflows/build.yml
    with:
      preset: torch
      tests: ${{ needs.checks.outputs.tests }}
      labels: backend-torch gradcheck example
      build_labels: backend-torch gradcheck example

  # The Python tests on libtorch (the bindings take torch tensors only there): the `python` target of the
  # python-torch preset, built and run against the oracle, in parallel to torch-tests. Not in `ci-gate`.
  python-torch-tests:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE' && needs.checks.outputs.torch == 'true'
    uses: ./.github/workflows/build.yml
    with:
      preset: python-torch
      tests: ${{ needs.checks.outputs.tests }}
      oracle: true
      labels: python
      build_targets: python

  # The core preset with MSVC: a compile error that only MSVC reports (POSIX setenv in a test). Not in
  # `ci-gate`: the build took 17 to 31 minutes.
  windows-core:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE'
    uses: ./.github/workflows/build.yml
    with:
      os: windows-latest
      preset: core
      tests: ${{ needs.checks.outputs.tests }}
      labels: unit

  # the lines that the pull request adds must be covered by the unit and the oracle tests (90%)
  line-coverage:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.tests != 'NONE' && needs.checks.outputs.perf == 'true'
    uses: ./.github/workflows/line-coverage.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}

  instructions:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        continue-on-error: true
        with:
          key: instructions
      # The runners' Ubuntu mirrors can fail to resolve; then valgrind comes from conda-forge.
      # Base and head are counted by the same valgrind, so the version does not matter.
      - name: install valgrind
        timeout-minutes: 15
        run: |
          if ! (sudo apt-get update && sudo apt-get install -y valgrind); then
            curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
            "$RUNNER_TEMP/bin/micromamba" create -y -q -p "$RUNNER_TEMP/vg" -c conda-forge valgrind
            echo "$RUNNER_TEMP/vg/bin" >> "$GITHUB_PATH"
          fi
      - name: compare with the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/instruction_counts.sh "$BASE"

  # The one check to require: success when every job above succeeded or was skipped (a
  # documentation-only change skips the builds), a failure otherwise.
  ci-gate:
    if: always()
    needs: [checks, tidy, linux-core, linux-python, line-coverage, instructions, torch-syntax]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
