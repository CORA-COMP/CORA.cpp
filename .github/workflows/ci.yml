# CI, tier 1: every push to a pull request and every merge-queue group (target: under 10 minutes)
#
# `checks` needs no build (it includes clang-format and ruff on the changed files); `tidy` configures the
# python preset and runs clang-tidy on the changed translation units. linux-core runs the labels unit, oracle,
# backend-eigen and example, linux-python the label python, both against the CORALean oracle, one step per label:
# on a pull request the tests the change can affect (scripts/ci/affected_tests.py), in the merge queue every test
# of the group on the main it lands on. A documentation-only change skips them. backend-torch and gradcheck need a
# libtorch build (about 30 minutes), so they run nightly. `instructions` compares the micro-benchmarks with the
# base commit's (pull requests only). The whole matrix (every preset, Windows, macOS, sanitizers) is tier 3
# (nightly.yml), which opens an issue when it fails; merge.yml runs it on demand. Require `ci-gate`.

name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      perf: ${{ steps.select.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet pyyaml -r scripts/requirements-quality.txt
      - name: format
        run: python3 scripts/ci/check_format.py
      - name: clang-format
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py format --base "$BASE"
      - name: ruff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py lint --base "$BASE"
      - name: conventions
        run: python3 tests/global/test_coding_conventions.py
      - name: coverage
        run: |
          if [ -f scripts/coverage/coverage.py ]; then python3 scripts/coverage/coverage.py --check
            python3 scripts/coverage/coverage.py --summary >> "$GITHUB_STEP_SUMMARY"
          else echo "scripts/coverage/coverage.py is absent: skipped"; fi
      - name: select the affected tests
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tests=$(python3 scripts/ci/affected_tests.py "$BASE" "$HEAD")
          # the merge queue runs every test unless the change is documentation only
          if [ "$EVENT" = merge_group ] && [ "$tests" != NONE ]; then tests=ALL; fi
          echo "selected: $tests"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          # the micro-benchmarks run when the library, the build or the benchmarks changed
          if [ "$tests" = ALL ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(src|include|benchmarks)/'; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
          else
            echo "perf=false" >> "$GITHUB_OUTPUT"
          fi

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet -r scripts/requirements-quality.txt
      - name: configure (the compile database, with the Python bindings)
        run: cmake --preset python -DCORACPP_NATIVE=OFF
      - name: clang-tidy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/check_quality.py tidy --base "$BASE" -j "$(nproc)"

  linux-core:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE'
    uses: ./.github/workflows/build.yml
    with:
      preset: core
      tests: ${{ needs.checks.outputs.tests }}
      oracle: true
      labels: unit oracle backend-eigen example

  linux-python:
    needs: checks
    if: needs.checks.outputs.tests != 'NONE'
    uses: ./.github/workflows/build.yml
    with:
      preset: python
      tests: ${{ needs.checks.outputs.tests }}
      oracle: true
      labels: python

  instructions:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        continue-on-error: true
        with:
          key: instructions
      # The runners' Ubuntu mirrors can fail to resolve; then valgrind comes from conda-forge.
      # Base and head are counted by the same valgrind, so the version does not matter.
      - name: install valgrind
        run: |
          if ! (sudo apt-get update && sudo apt-get install -y valgrind); then
            curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
            "$RUNNER_TEMP/bin/micromamba" create -y -q -p "$RUNNER_TEMP/vg" -c conda-forge valgrind
            echo "$RUNNER_TEMP/vg/bin" >> "$GITHUB_PATH"
          fi
      - name: compare with the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/instruction_counts.sh "$BASE"

  # The one check to require: success when every job above succeeded or was skipped (a
  # documentation-only change skips the builds), a failure otherwise.
  ci-gate:
    if: always()
    needs: [checks, tidy, linux-core, linux-python, instructions]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
